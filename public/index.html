
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>Chat Bot EB14 — Panel</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Chat Bot EB14</h1>
        <p>Panel de administración de comandos</p>
      </div>
      <span class="notice">Editor visual · Primera versión</span>
    </header>

    <nav class="tabs" aria-label="Categorías de comandos">
      <button class="tab selected" data-tab="simple">Simple</button>
      <button class="tab" data-tab="categoria">Categoría</button>
      <button class="tab" data-tab="modular">Modular</button>
    </nav>

    <div class="toolbar">
      <button id="manageChannels">＋ Gestionar canales</button>
      <button class="primary" id="addCommand">＋ Nuevo comando</button>
    </div>

    <section id="channelManager" class="panel" hidden>
      <h2>Canales disponibles</h2>
      <p>Estos canales aparecerán al editar cualquier comando.</p>

      <form id="channelForm" class="toolbar">
        <input id="newChannel" type="text"
          placeholder="Nombre del canal de Twitch" required>
        <button class="primary" type="submit">Agregar canal</button>
      </form>

      <div id="channelList" class="channel-list"></div>
    </section>

    <section id="commandList" aria-live="polite"></section>

    <p class="notice">
      Versión de prueba: los cambios todavía no se guardan permanentemente.
    </p>
  </main>

  <div class="overlay" id="editorOverlay"
    role="dialog" aria-modal="true" aria-labelledby="editorTitle">

    <form class="modal" id="editorForm">
      <div class="modal-head">
        <h2 id="editorTitle">Editar comando</h2>
        <button type="button" class="close" id="closeEditor"
          aria-label="Cerrar">×</button>
      </div>

      <div class="field">
        <label for="commandName">Comando</label>
        <input id="commandName" type="text"
          placeholder="!comando" required>
      </div>

      <div class="checkline field">
        <label>
          <input type="checkbox" id="commandMod">
          Solo moderadores
        </label>

        <label>
          <input type="checkbox" id="commandActive">
          Activo
        </label>
      </div>

      <div class="field">
        <label>Canales autorizados</label>
        <div id="editorChannels" class="channel-list"></div>
      </div>

      <div class="field">
        <label for="commandResponse">Respuesta del bot</label>
        <textarea id="commandResponse"
          placeholder="Escribe la respuesta del comando..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" id="cancelEditor">Cancelar</button>
        <button class="primary" type="submit">Guardar</button>
      </div>
    </form>
  </div>
</body>
</html>
